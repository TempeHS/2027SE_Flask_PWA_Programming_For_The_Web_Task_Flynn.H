{% extends 'layout.html' %} {% block content %}
<div class="container">
  {% for row in content %}
  <div class="card">
    <img
      class="card-image"
      src="{{ row[4] }}"
      alt="Product image for the {{ row[1] }} VSCode extension."
    />
    <h1 class="card-name">{{ row[1] }}</h1>
    <p class="card-about">{{ row[3] }}</p>
    <a class="btn" href="{{ row[2] }}">Read More</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
